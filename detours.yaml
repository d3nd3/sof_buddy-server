# Registry of symbols the shim may resolve or hook.
# RVAs (< 0x10000000) are relative to the PE module named in `module` (see runtime/detours.cpp).
# Absolute addresses are used as-is.
#
# Com_DPrintf: id-style developer logging (guarded by developer cvar in the engine).
# Address from sof_buddy / retail SoF.exe — verify for your server binary if needed.

functions:
  - name: Com_DPrintf
    module: SofExe
    identifier: "0x2001C8E0"
    return_type: void
    calling_convention: __cdecl
    detour_len: 0
    variadic: true
    params:
      - type: const char*
        name: fmt

  - name: Com_Printf
    module: SofExe
    identifier: "0x2001C6E0"
    return_type: void
    calling_convention: __cdecl
    detour_len: 0
    variadic: true
    params:
      - type: const char*
        name: fmt

  # SoF-spsv.exe / SoF.exe share engine .text (verified address-identical).
  # SV_RunGameFrame @ 0x2005F3F0: framenum++ → sv_time=fn*100 → ge->RunFrame()
  # → if (sv_time < svs_realtime) { "sv highclamp"; svs_realtime = sv_time; }

  # --- engine frame loop (tick_pacing) -------------------------------------
  # Absolute addresses on purpose: SofExe RVA resolution goes through
  # GetModuleHandleA("SoF.exe"), which is NULL on a SoF-spsv.exe server.
  #
  # WinMain @0x20066300:  Sleep(1) -> PeekMessage pump -> spin until
  #   (Sys_Milliseconds() - oldtime) >= 1 -> Qcommon_frame(msec) -> oldtime=newtime
  # Qcommon_frame @0x2001F720: Sys_ConsoleInput/Cbuf_Execute @0x2001F885, then
  #   SV_Frame(msec) @0x2001F8BB, then CL_Frame(msec) (returns at once when
  #   the `dedicated` cvar is set).
  # SV_Frame @0x2005F5B0: svs.realtime += msec; SV_ReadPackets(); then
  #   `if (svs.realtime < sv.time) { maybe lowclamp; return; }` else
  #   SV_RunGameFrame() @0x2005F3F0 (which is where "sv highclamp" lives).
  - name: Qcommon_frame
    module: SofExe
    identifier: "0x2001F720"
    return_type: void
    calling_convention: __cdecl
    detour_len: 0
    params:
      - type: int
        name: msec

  - name: SV_Frame
    module: SofExe
    identifier: "0x2005F5B0"
    return_type: void
    calling_convention: __cdecl
    detour_len: 0
    params:
      - type: int
        name: msec

  - name: SV_RunGameFrame
    module: SofExe
    identifier: "0x2005F3F0"
    return_type: void
    calling_convention: __cdecl
    detour_len: 0
    params: []

  # SV_ReadPackets @0x2005F100: called from SV_Frame @0x2005F5EF and from
  # nowhere else (verified: one caller). It sits *after* the
  # `svs.realtime += msec` at 0x2005F5E2 and *before* the lowclamp test at
  # 0x2005F60A, which makes a Post hook on it the exact analogue of what
  # clamp_monitor already does for highclamp via G_RunFrame: the two globals
  # hold precisely the values the engine's own `sv.time - svs.realtime > 100`
  # is about to be computed from, and nothing can perturb them in between.
  - name: SV_ReadPackets
    module: SofExe
    identifier: "0x2005F100"
    return_type: void
    calling_convention: __cdecl
    detour_len: 0
    params: []

  # SV_ClientThink @0x200635F0: (client_t* cl, usercmd_t* cmd) from clc_move
  # after MSG_ReadDeltaUserCmd; calls ge->ClientThink unless cinematic freeze.
  - name: SV_ClientThink
    module: SofExe
    identifier: "0x200635F0"
    return_type: void
    calling_convention: __cdecl
    detour_len: 0
    params:
      - type: void*
        name: client
      - type: void*
        name: cmd

  # SV_ExecuteClientMessage @0x200636C0: (client_t* cl) from SV_ReadPackets.
  # Full per-client packet dispatch: clc_move branch does checksum +
  # lastServerFrame + InPacket decrypt + 3x MSG_ReadDeltaUserCmd + CRC +
  # all SV_ClientThink calls for that packet (see IDA callees); also handles
  # clc_userinfo / clc_stringcmd. Lagometer times this as the clc_move cost
  # instead of timing individual SV_ClientThink calls.
  - name: SV_ExecuteClientMessage
    module: SofExe
    identifier: "0x200636C0"
    return_type: void
    calling_convention: __cdecl
    detour_len: 0
    params:
      - type: void*
        name: client

  - name: Cbuf_Execute
    module: SofExe
    identifier: "0x20018530"
    return_type: void
    calling_convention: __cdecl
    detour_len: 0
    params: []

  # Cbuf_AddText @0x20018180: append; overflow drops the new text.
  # sofplus ClientCommand_HOOK (.COMMAND / "say .COMMAND") reaches this via
  # ScriptEventDispatcher(directInsert=0) from SV_ReadPackets, i.e. after
  # this loop's Cbuf_Execute and often on an inter-tick SV_Frame.
  - name: Cbuf_AddText
    module: SofExe
    identifier: "0x20018180"
    return_type: void
    calling_convention: __cdecl
    detour_len: 0
    params:
      - type: char*
        name: text

  # Cbuf_InsertText @0x200181D0: stock Quake 2, with Cbuf_AddText inlined -
  # Z_Malloc(cursize) + copy out + SZ_Clear + AddText + copy back + Z_Free.
  # Only one engine caller (newsave @0x20061690); sofplus calls it directly by
  # address, which is what makes it worth overriding. Note Cbuf_ExecuteText
  # @0x20018380 carries a second, inlined copy of the same body for its
  # EXEC_INSERT branch (@0x2001842A) - not reachable from this hook.
  - name: Cbuf_InsertText
    module: SofExe
    identifier: "0x200181D0"
    return_type: void
    calling_convention: __cdecl
    detour_len: 0
    params:
      - type: char*
        name: text

  # Cbuf_ExecuteText @0x20018380: EXEC_NOW=0 / INSERT=1 / APPEND=2. Insert and
  # append inlined (do not call Cbuf_InsertText / Cbuf_AddText).
  - name: Cbuf_ExecuteText
    module: SofExe
    identifier: "0x20018380"
    return_type: void
    calling_convention: __cdecl
    detour_len: 0
    params:
      - type: int
        name: exec_when
      - type: char*
        name: text

  # Cmd_ExecuteString @0x200194F0: per-command call inside Cbuf_Execute
  # (0x200185BC). cmd_cost times Pre/Post only — never cmd_wait.
  - name: Cmd_ExecuteString
    module: SofExe
    identifier: "0x200194F0"
    return_type: void
    calling_convention: __cdecl
    detour_len: 0
    params:
      - type: char*
        name: text

