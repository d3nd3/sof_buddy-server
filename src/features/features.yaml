# Optional features: each key is a directory under src/features/<name>/.
# Core (src/core/) is always included — not listed here.
# Use true / false so every feature can be toggled explicitly in one place.

features:
  example: false
  ctf_spawn: false
  clamp_monitor: true
  hash_lookup: true
  tick_pacing: true
  cbuf_insert: true
  # Disabled: measured a net LOSS on a live server (see src/features/zpool/README.md).
  # Kept in the tree as a recorded negative result, not built in.
  zpool: false
  # my_feature: false

# Alternative: list only enabled names (merged with `features:` above if both present).
# enabled:
#   - example
